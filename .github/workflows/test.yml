name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests (incl. llms.txt sync guard)
        env:
          MPLBACKEND: Agg
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: pytest tests/ -q --tb=short

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # nbsphinx needs pandoc even when notebooks are not executed.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Install package + docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx HTML
        env:
          MPLBACKEND: Agg
        # Match Read the Docs: fail on errors, not on every warning
        # (fail_on_warning: false in .readthedocs.yaml).
        run: |
          python -m sphinx -b html -q -E docs docs/_build/html
