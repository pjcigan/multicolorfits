# .readthedocs.yaml
# Legacy filename — prefer `.readthedocs.yaml` at the repository root (same
# content). Kept so older RTD project settings that point here still work.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
